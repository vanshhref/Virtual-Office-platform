name: Backend CI Pipeline

# Trigger the workflow on pushes and pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x] # Tests across multiple Node versions

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm' # Caches dependencies to make builds faster

    - name: Install Dependencies
      run: npm ci

    - name: Compile TypeScript
      run: npm run build --if-present

    - name: Run Tests
      run: npm test --if-present

    # Optional: Verify the Docker build works since you use containerization
    - name: Test Docker Build
      run: docker build -t backend-test .
